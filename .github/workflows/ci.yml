name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: lockedin
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/lockedin
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lockedin/shared build

      - name: Generate Prisma client
        run: pnpm --filter @lockedin/api exec prisma generate --config prisma7.config.ts

      - name: Apply migrations
        run: pnpm --filter @lockedin/api exec prisma migrate deploy --config prisma7.config.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          printf '%s\n' '/// <reference types="next" />' '/// <reference types="next/image-types/global" />' > apps/web/next-env.d.ts
          pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API tests
        run: pnpm --filter @lockedin/api test:e2e
